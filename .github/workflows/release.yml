name: Play release bundle

# Builds a signed AAB for Google Play. Runs on a version tag (v1.0.0) or manually.
# Needs four repository secrets (Settings → Secrets and variables → Actions):
#   VOCAB_UPLOAD_KEYSTORE_BASE64  output of: base64 -w0 vocabsolution-upload.jks
#   VOCAB_UPLOAD_STORE_PASSWORD
#   VOCAB_UPLOAD_KEY_ALIAS        (upload)
#   VOCAB_UPLOAD_KEY_PASSWORD
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore upload key
        env:
          KEYSTORE_B64: ${{ secrets.VOCAB_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::VOCAB_UPLOAD_KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "VOCAB_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Signed release bundle
        env:
          VOCAB_UPLOAD_STORE_PASSWORD: ${{ secrets.VOCAB_UPLOAD_STORE_PASSWORD }}
          VOCAB_UPLOAD_KEY_ALIAS: ${{ secrets.VOCAB_UPLOAD_KEY_ALIAS }}
          VOCAB_UPLOAD_KEY_PASSWORD: ${{ secrets.VOCAB_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease
      - name: Verify signature
        run: jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tee /dev/stderr | grep -q "jar verified"
      - uses: actions/upload-artifact@v4
        with:
          name: vocabsolution-release-aab
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
