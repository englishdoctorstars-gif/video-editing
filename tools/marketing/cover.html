<!doctype html>
<html lang="bn"><head><meta charset="utf-8">
<style>
@font-face{font-family:Hind;font-weight:400;src:url("../../app/src/main/res/font/hind_siliguri_regular.ttf")}
@font-face{font-family:Hind;font-weight:600;src:url("../../app/src/main/res/font/hind_siliguri_semibold.ttf")}
@font-face{font-family:Hind;font-weight:700;src:url("../../app/src/main/res/font/hind_siliguri_bold.ttf")}
@page{size:5.5in 8.5in;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:5.5in;height:8.5in}
body{font-family:Hind,sans-serif;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cover{position:relative;width:5.5in;height:8.5in;overflow:hidden;
  background:radial-gradient(120% 70% at 50% 38%,#16408c 0%,#0b2a5e 42%,#061737 100%)}
.tex{position:absolute;inset:0}
.frame{position:absolute;inset:.2in;border:1.2px solid rgba(255,200,61,.55);border-radius:.14in}
.frame:after{content:"";position:absolute;inset:.05in;border:.5px solid rgba(255,200,61,.25);border-radius:.1in}
.in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:.52in .45in .42in}
.tag{font-weight:700;font-size:11.5pt;color:#0b2a5e;background:linear-gradient(90deg,#ffd45c,#ffb300);padding:.035in .2in;border-radius:99px;letter-spacing:.2px}
.title{margin-top:.2in;font-family:"Inter Display",Inter,sans-serif;font-weight:900;line-height:.92;letter-spacing:1.5px}
.title .a{display:block;font-size:53pt;color:#fff}
.title .b{display:block;font-size:41.5pt;background:linear-gradient(180deg,#ffe082,#ffb300);-webkit-background-clip:text;color:transparent;letter-spacing:2.2px}
.by{margin-top:.1in;font-family:Inter,sans-serif;font-size:10.5pt;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.8)}
.by b{color:#ffd45c;font-weight:700}
.sub{margin-top:.13in;font-weight:600;font-size:13.5pt;color:#fff}
.rule{width:.6in;height:2.5px;border-radius:2px;background:linear-gradient(90deg,#ffd45c,#ffb300);margin-top:.1in}
.art{margin-top:.1in;width:4.3in;height:2.6in;position:relative}
.art svg{width:100%;height:100%}
.methods{margin-top:.12in;display:flex;gap:.09in;font-weight:700;font-size:10.5pt}
.methods span{padding:.03in .13in;border:1px solid rgba(255,255,255,.3);border-radius:99px;background:rgba(255,255,255,.07)}
.stats{margin-top:.16in;display:flex;width:100%;justify-content:center}
.stats div{flex:1;padding:0 .04in;border-left:1px solid rgba(255,255,255,.2)}
.stats div:first-child{border-left:0}
.stats b{display:block;font-size:19pt;line-height:1.1;color:#ffd45c}
.stats small{font-size:8.6pt;font-weight:600;color:rgba(255,255,255,.85)}
.for{margin-top:.12in;font-size:10pt;font-weight:600;color:rgba(255,255,255,.85);letter-spacing:.3px}
.author{margin-top:auto;width:100%}
.author .n{font-family:Inter,sans-serif;font-weight:800;font-size:14.5pt;letter-spacing:.4px}
.author .n i{font-style:normal;color:#ffd45c}
.author .bn{font-size:10.5pt;font-weight:600;color:rgba(255,255,255,.8);margin-top:.02in}
</style></head><body>
<div class="cover">
  <svg class="tex" viewBox="0 0 550 850" preserveAspectRatio="none">
    <defs><pattern id="d" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#fff" opacity=".07"/></pattern>
    <radialGradient id="g"><stop offset="0" stop-color="#ffc83d" stop-opacity=".28"/><stop offset="1" stop-color="#ffc83d" stop-opacity="0"/></radialGradient></defs>
    <rect width="550" height="850" fill="url(#d)"/>
    <circle cx="275" cy="455" r="250" fill="url(#g)"/>
    <g font-family="Inter" font-weight="800" fill="#fff" opacity=".06">
      <text x="34" y="205" font-size="40">un-</text><text x="430" y="250" font-size="36">-tion</text>
      <text x="40" y="640" font-size="34">re-</text><text x="452" y="615" font-size="34">-ly</text>
      <text x="420" y="760" font-size="40">A–Z</text><text x="46" y="770" font-size="42">Aa</text>
    </g>
  </svg>
  <div class="frame"></div>
  <div class="in">
    <div class="tag">মুখস্থের অবসান!</div>
    <div class="title"><span class="a">VOCAB</span><span class="b">SOLUTION</span></div>
    <div class="by">by <b>English Doctor</b></div>
    <div class="sub">সবার জন্য একটি পূর্ণাঙ্গ শব্দভাণ্ডার সমাধান</div>
    <div class="rule"></div>

    <div class="art">
      <svg viewBox="0 0 450 272" font-family="Inter" font-weight="800">
        <defs>
          <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe082"/><stop offset="1" stop-color="#ffb300"/></linearGradient>
          <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".4"/></filter>
        </defs>
        <!-- one root, many words -->
        <g stroke="#fff" stroke-opacity=".35" stroke-width="1.3" fill="none">
          <path d="M225 150 C150 150 120 60 78 46"/><path d="M225 150 C180 120 190 60 172 26"/>
          <path d="M225 150 C270 120 262 60 280 26"/><path d="M225 150 C300 150 330 60 372 46"/>
          <path d="M225 150 C140 160 110 130 58 122"/><path d="M225 150 C310 160 340 130 392 122"/>
        </g>
        <g filter="url(#sh)" font-size="13.5" text-anchor="middle" fill="#fff">
          <g><rect x="38" y="30" width="80" height="27" rx="13.5" fill="#1e88e5"/><text x="78" y="48.5">■ action</text></g>
          <g><rect x="132" y="8" width="80" height="27" rx="13.5" fill="#e53935"/><text x="172" y="26.5">▲ react</text></g>
          <g><rect x="240" y="8" width="80" height="27" rx="13.5" fill="#43a047"/><text x="280" y="26.5">● active</text></g>
          <g><rect x="326" y="30" width="92" height="27" rx="13.5" fill="#8e24aa"/><text x="372" y="48.5">◆ actively</text></g>
          <g><rect x="14" y="108" width="88" height="27" rx="13.5" fill="#43a047"/><text x="58" y="126.5">● inactive</text></g>
          <g><rect x="348" y="108" width="88" height="27" rx="13.5" fill="#e53935"/><text x="392" y="126.5">▲ activate</text></g>
        </g>
        <g filter="url(#sh)"><circle cx="225" cy="140" r="47" fill="url(#gold)"/><circle cx="225" cy="140" r="41" fill="none" stroke="#0b2a5e" stroke-opacity=".25"/>
          <text x="225" y="145" font-size="27" font-weight="900" text-anchor="middle" fill="#0b2a5e">ACT</text>
          <text x="225" y="163" font-size="10.5" font-family="Hind" font-weight="700" text-anchor="middle" fill="#0b2a5e">মূল শব্দ</text></g>
        <!-- dissection -->
        <g filter="url(#sh)" font-size="19" text-anchor="middle" fill="#fff">
          <rect x="62" y="210" width="62" height="36" rx="9" fill="#26a69a"/><text x="93" y="235">de</text>
          <rect x="136" y="210" width="106" height="36" rx="9" fill="#1e88e5"/><text x="189" y="235">human</text>
          <rect x="254" y="210" width="58" height="36" rx="9" fill="#fb8c00"/><text x="283" y="235">ize</text>
          <rect x="324" y="210" width="84" height="36" rx="9" fill="#8e24aa"/><text x="366" y="235">ation</text>
        </g>
        <g font-size="15" fill="#fff" opacity=".8" text-anchor="middle"><text x="130" y="234">+</text><text x="248" y="234">+</text><text x="318" y="234">+</text></g>
        <g font-family="Hind" font-weight="600" font-size="9.5" text-anchor="middle" fill="#fff" opacity=".85">
          <text x="93" y="262">উপসর্গ</text><text x="189" y="262">মূল</text><text x="283" y="262">প্রত্যয়</text><text x="366" y="262">প্রত্যয়</text></g>
      </svg>
    </div>

    <div class="methods"><span>ভেঙে বুঝুন</span><span>মূল ধরে শিখুন</span><span>গল্পে মনে রাখুন</span></div>
    <div class="stats">
      <div><b>২,৬৯৪</b><small>শব্দ</small></div>
      <div><b>৯৬</b><small>শব্দ-পরিবার</small></div>
      <div><b>১০০</b><small>মনে রাখার গল্প</small></div>
      <div><b>১১</b><small>অধ্যায়</small></div>
    </div>
    <div class="for">বিসিএস · ব্যাংক · চাকরির পরীক্ষা · IELTS</div>

    <div class="author">
      <div class="rule" style="margin:0 auto .1in"></div>
      <div class="n">Shahjalal Sultanate <i>(English Doctor)</i></div>
      <div class="bn">শাহজালাল সালতানাত (ইংলিশ ডক্টর)</div>
    </div>
  </div>
</div>
</body></html>
